system_name: 应急通信装备台账管理与测试支撑系统
current_version: 0.7.0
last_aligned: "2026-08-18T16:56:10+08:00"

architecture:
  pattern: 本地单体工具
  deployment: 本地 Python 命令行运行（后续可扩展为内网 Web/外部 AI 接口）
  services:
    equipment.ingest:
      description: 读取应急通信设备汇总表 xlsx，归一化后写入 SQLite
      status: 正常
    equipment.cli:
      description: 按区/街镇/设备类型/状态等条件查询台账，支持导出 Excel
      status: 正常
    equipment.risk_ingest:
      description: 导入风险村台账（189 村）到 risk_villages / risk_village_aliases
      status: 正常
    equipment.benchmark_ingest:
      description: 读取《应急装备数量统计（内部）》xlsx，按设备类型+统计单位+口径写入 equipment_benchmark
      status: 正常

dependencies:
  database:
    type: SQLite
    path: "data/equipment.db"
    tables:
      - devices
      - unit_tags
      - risk_villages
      - risk_village_aliases
      - equipment_benchmark
  external_apis:
    外部AI接口: 规划中，仅接入脱敏数据

known_issues:
  - 测试报告与日报、周报、测试进度固定模板及 emergency-test-reports skill 已就绪，阶段 C 自动生成方案待用户确认
  - 风险村台账与全量台账设备数有 2 处出入（大田村 370 手台预置 1 台但全量挂在汉沽街道级、桃园村北斗全量实际 1 台而台账预置 0），属预置数与实际配发数的正常差异，已记录待确认
  - 无人机按“设备类型+区”汇总入库至 equipment_benchmark，不写入 devices 逐台明细；370MHz 不新增“可用状态/配发来源”字段，沿用配置/可用/配发/自购口径

